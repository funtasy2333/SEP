name: SES Preview release

on:
  push:
    branches: ['codex/windows-preview-0.1.0']
    tags: ['v*-preview']
  # 升级/退出相关改动在合并前就跑完整的升级 E2E；release 任务仍只在打标签时运行。
  pull_request:
    paths:
      - 'scripts/**'
      - '启动SES.*'
      - '退出SES.*'
      - '.github/workflows/preview-release.yml'
      - 'packages/server/src/system/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SES_NO_OPEN: '1'
      SES_NO_PAUSE: '1'
      SES_NO_SHORTCUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          architecture: x64
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test network fallback using Windows PowerShell 5.1
        env:
          SES_PWSH: powershell.exe
        run: python scripts/test_ses_windows.py
      - name: Test Windows desktop integration using Windows PowerShell 5.1
        env:
          SES_PWSH: powershell.exe
        run: python scripts/test_ses_desktop.py
      - name: Verify literal paths and detached service logs
        run: python scripts/test_service_spawn.py
      - name: Verify package contents
        run: python scripts/test_package_release.py
      - name: Verify the upgrade executor (file replacement, rollback, path safety)
        run: python scripts/test_apply_update.py
      - name: Verify startup build-state and backup retention
        run: python scripts/test_startup_state.py
      - name: Verify the Windows upgrade script with Windows PowerShell 5.1
        env:
          SES_PWSH: powershell.exe
        run: python scripts/test_ses_upgrade_windows.py
      - name: Stage the self-contained Windows runtime
        run: ./scripts/build-windows-runtime.ps1 -Output "$env:RUNNER_TEMP\ses-runtime"
      - name: Build the Windows release and upgrade test packages
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'ses-runtime'
          python scripts/package-release.py --platform windows --windows-runtime $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
          python scripts/package-release.py --platform windows --windows-runtime $runtime --version 9.9.9-preview --output release-next
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade test package failed' }
          python scripts/package-release.py --platform windows --windows-runtime $runtime --version 9.9.10-preview --output release-broken
          if ($LASTEXITCODE -ne 0) { throw 'Rollback test package failed' }
          python scripts/upgrade_e2e.py make-broken --zip release-broken/SES-9.9.10-preview-windows.zip --out release-broken/broken-windows.zip
      - name: Start the Windows ZIP offline without system Node.js or pnpm
        shell: pwsh
        run: |
          $version = (python scripts/package-release.py --print-version).Trim()
          $destination = Join-Path $env:RUNNER_TEMP 'SES [preview] 中文 path'
          python -m zipfile -e "release/SES-$version-windows.zip" $destination
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP extraction failed' }
          $root = Join-Path $destination "SES-$version-windows"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SES_E2E_ROOT=$root" -Encoding utf8
          $firewall = "SES portable offline check $env:GITHUB_RUN_ID"
          New-NetFirewallRule -DisplayName $firewall -Direction Outbound -Action Block -RemoteAddress Internet -Program (Join-Path $root '.ses-runtime/node.exe') | Out-Null
          try {
            $savedPath = $env:Path
            $savedModules = $env:PSModulePath
            Push-Location -LiteralPath $root
            try {
              $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
              $env:PSModulePath = $null
              & cmd.exe /d /c '启动SES.cmd'
              if ($LASTEXITCODE -ne 0) { throw 'Offline startup failed' }
            } finally {
              $env:Path = $savedPath
              $env:PSModulePath = $savedModules
              Pop-Location
            }
            python scripts/upgrade_e2e.py portable-smoke --root $root
            if ($LASTEXITCODE -ne 0) { throw 'Offline editor and DOCX smoke test failed' }
          } finally {
            Remove-NetFirewallRule -DisplayName $firewall
          }
      - name: Restart the Windows release with the upgrade test endpoint and reuse services
        shell: pwsh
        run: |
          $root = $env:SES_E2E_ROOT
          $entry = Join-Path $root 'scripts/ses-windows.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry stop
          if ($LASTEXITCODE -ne 0) { throw 'Shutdown after offline test failed' }
          # Local stand-in for the GitHub API/downloads; writes SES_GITHUB_API into <root>\.env, which the server reads at startup.
          python scripts/upgrade_e2e.py start-fake-github --root "$root" --zip release-next/SES-9.9.9-preview-windows.zip --platform windows --version 9.9.9-preview
          if ($LASTEXITCODE -ne 0) { throw 'Fake upstream failed to start' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry start
          if ($LASTEXITCODE -ne 0) { throw 'First startup failed' }
          $before = Get-Content -LiteralPath (Join-Path $root '.ses-run/server.json') -Raw
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry start
          if ($LASTEXITCODE -ne 0) { throw 'Repeated startup failed' }
          if ((Get-Content -LiteralPath (Join-Path $root '.ses-run/server.json') -Raw) -ne $before) { throw 'Repeated startup replaced the server' }
          Invoke-WebRequest http://127.0.0.1:5173/api/documents | Out-Null
      - name: Upgrade E2E - upgrade to 9.9.9-preview through /api/system (server launches the executor; document kept)
        run: python scripts/upgrade_e2e.py api-upgrade --root "$env:SES_E2E_ROOT" --platform windows --installed 9.9.9-preview
      - name: Upgrade E2E - run the executor on a package that fails to build (rolls back, document kept)
        run: python scripts/upgrade_e2e.py upgrade --root "$env:SES_E2E_ROOT" --platform windows --zip release-broken/broken-windows.zip --target-version 9.9.10-preview --installed 9.9.9-preview --expect rolled-back --no-detached
      - name: Exit through /api/system/shutdown
        run: python scripts/upgrade_e2e.py shutdown-api --platform windows
      - name: Start again
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:SES_E2E_ROOT 'scripts/ses-windows.ps1') start
          if ($LASTEXITCODE -ne 0) { throw 'Startup after shutdown failed' }
          Invoke-WebRequest http://127.0.0.1:5173/api/documents | Out-Null
      - name: Stop with the exit script and verify no listeners remain
        if: always()
        shell: pwsh
        run: |
          if ($env:SES_E2E_ROOT) {
            python scripts/upgrade_e2e.py stop-fake-github --root "$env:SES_E2E_ROOT"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:SES_E2E_ROOT 'scripts/ses-windows.ps1') stop
            if ($LASTEXITCODE -ne 0) { throw 'Shutdown failed' }
          }
          if (Get-NetTCPConnection -State Listen | Where-Object LocalPort -in @(3000, 5173)) { throw 'SES listeners remain after shutdown' }
      - uses: actions/upload-artifact@v7
        with:
          path: release/SES-*-windows.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-launcher-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/SES*/**/.ses-run/*.log
            ${{ runner.temp }}/SES*/**/.ses-run/*.json

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SES_NO_OPEN: '1'
      SES_NO_PAUSE: '1'
      SES_NO_SHORTCUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          architecture: arm64
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Verify existing launcher version guards
        run: bash scripts/ses-local.runtime.test.sh
      - name: Verify macOS desktop integration
        run: |
          bash scripts/ses-desktop.test.sh
          python3 scripts/test_ses_desktop.py
      - name: Verify package contents
        run: python3 scripts/test_package_release.py
      - name: Verify the upgrade executor (file replacement, rollback, path safety)
        run: python3 scripts/test_apply_update.py
      - name: Verify startup build-state and backup retention
        run: python3 scripts/test_startup_state.py
      - name: Verify the macOS upgrade script (success, rollback, failure paths)
        run: bash scripts/ses-upgrade.test.sh
      - name: Build and verify the native arm64 runtime
        run: bash scripts/build-macos-runtime.sh "$RUNNER_TEMP/ses-runtime"
      - name: Build the macOS arm64 release and upgrade test packages
        run: |
          runtime="$RUNNER_TEMP/ses-runtime"
          python3 scripts/package-release.py --platform macos --macos-runtime "$runtime"
          python3 scripts/package-release.py --platform macos --macos-runtime "$runtime" --version 9.9.9-preview --output release-next
          python3 scripts/package-release.py --platform macos --macos-runtime "$runtime" --version 9.9.10-preview --output release-broken
          python3 scripts/upgrade_e2e.py make-broken --zip release-broken/SES-9.9.10-preview-macos-arm64.zip --out release-broken/broken-macos.zip
      - name: Start the Apple Silicon package without system Node.js or pnpm
        run: |
          version="$(python3 scripts/package-release.py --print-version)"
          destination="$RUNNER_TEMP/SES 中文 path"
          mkdir -p "$destination"
          ditto -x -k "release/SES-$version-macos-arm64.zip" "$destination"
          root="$destination/SES-$version-macos-arm64"
          echo "SES_E2E_ROOT=$root" >> "$GITHUB_ENV"
          printf 'SES_GITHUB_API=http://127.0.0.1:9\n' > "$root/.env"
          PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash "$root/启动SES.command"
          python3 scripts/upgrade_e2e.py portable-smoke --platform macos --root "$root"
      - name: Restart the macOS release with the upgrade test endpoint
        run: |
          /bin/bash "$SES_E2E_ROOT/退出SES.command"
          rm "$SES_E2E_ROOT/.env"
          python3 scripts/upgrade_e2e.py start-fake-github --root "$SES_E2E_ROOT" --zip release-next/SES-9.9.9-preview-macos-arm64.zip --platform macos --version 9.9.9-preview
          /bin/bash "$SES_E2E_ROOT/启动SES.command"
      - name: Upgrade E2E - upgrade to 9.9.9-preview through /api/system (server launches the executor under launchd; document kept)
        run: python3 scripts/upgrade_e2e.py api-upgrade --root "$SES_E2E_ROOT" --platform macos --installed 9.9.9-preview
      - name: Upgrade E2E - run the executor on a package that fails to build (rolls back, document kept)
        run: python3 scripts/upgrade_e2e.py upgrade --root "$SES_E2E_ROOT" --platform macos --zip release-broken/broken-macos.zip --target-version 9.9.10-preview --installed 9.9.9-preview --expect rolled-back --no-detached
      - name: Exit through /api/system/shutdown
        run: |
          # 服务可能在回复前就退出，所以不用 --fail；是否真的退出由端口断言决定。
          curl --silent --show-error --write-out '\nHTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -H 'Origin: http://localhost:5173' http://127.0.0.1:3000/api/system/shutdown -d '{}' || true
          python3 scripts/upgrade_e2e.py assert-stopped
      - name: Start again
        run: |
          /bin/bash "$SES_E2E_ROOT/scripts/ses-local.sh" start
          curl --fail http://localhost:5173/api/documents
      - name: Stop with the exit script and verify no listeners remain
        if: always()
        run: |
          if [ -n "${SES_E2E_ROOT:-}" ]; then
            python3 scripts/upgrade_e2e.py stop-fake-github --root "$SES_E2E_ROOT" || true
            /bin/bash "$SES_E2E_ROOT/scripts/ses-local.sh" stop
          fi
          python3 scripts/upgrade_e2e.py assert-stopped
      - uses: actions/upload-artifact@v7
        with:
          path: release/SES-*-macos-arm64.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-launcher-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/SES*/**/.ses-run/*.log
            ${{ runner.temp }}/SES*/**/.ses-run/*.json

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: SES-*-windows.zip
          path: release
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          pattern: SES-*-macos-arm64.zip
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Build the legacy macOS source archive
        run: python3 scripts/package-release.py --platform macos
      - name: Publish preview release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/package-release.py --print-version)"
          # 标签必须与打包脚本的版本一致，避免把旧版本号的压缩包发到新标签下。
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "release/SES-$version-windows.zip" "release/SES-$version-macos-arm64.zip" "release/SES-$version-macos.zip" --verify-tag --prerelease --title "SES ${version%-preview} (Preview)" --notes-file .github/preview-release-notes.md
