name: SES Preview release

on:
  push:
    branches: ['codex/windows-preview-0.1.0']
    tags: ['v*-preview']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test network fallback using Windows PowerShell 5.1
        env:
          SES_PWSH: powershell.exe
        run: python scripts/test_ses_windows.py
      - name: Verify package contents
        run: python scripts/test_package_release.py
      - name: Build runtime archives
        run: python scripts/package-release.py
      - name: Start extracted Windows release, reuse services and stop
        shell: pwsh
        env:
          SES_NO_OPEN: '1'
          SES_NO_PAUSE: '1'
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'SES [preview] 中文 path'
          Expand-Archive release/SES-0.1.0-preview-windows.zip $destination
          $entry = Join-Path $destination 'SES-0.1.0-preview-windows/scripts/ses-windows.ps1'
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry start
            if ($LASTEXITCODE -ne 0) { throw 'First startup failed' }
            $before = Get-Content -LiteralPath (Join-Path (Split-Path $entry) '../.ses-run/server.json') -Raw
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry start
            if ($LASTEXITCODE -ne 0) { throw 'Repeated startup failed' }
            if ((Get-Content -LiteralPath (Join-Path (Split-Path $entry) '../.ses-run/server.json') -Raw) -ne $before) { throw 'Repeated startup replaced the server' }
            Invoke-WebRequest http://127.0.0.1:5173/api/documents | Out-Null
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry stop
            if ($LASTEXITCODE -ne 0) { throw 'Shutdown failed' }
          }
          if (Get-NetTCPConnection -State Listen | Where-Object LocalPort -in @(3000, 5173)) { throw 'SES listeners remain after shutdown' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-launcher-logs
          path: ${{ runner.temp }}/SES*/**/.ses-run/*.log

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - name: Verify existing launcher version guards
        run: bash scripts/ses-local.runtime.test.sh
      - name: Build clean macOS archive
        run: python3 scripts/package-release.py
      - name: Start extracted macOS release and stop
        env:
          SES_NO_OPEN: '1'
        run: |
          destination="$RUNNER_TEMP/SES 中文 path"
          mkdir -p "$destination"
          unzip -q release/SES-0.1.0-preview-macos.zip -d "$destination"
          entry="$destination/SES-0.1.0-preview-macos/scripts/ses-local.sh"
          trap '/bin/bash "$entry" stop' EXIT
          /bin/bash "$entry" start
          curl --fail http://localhost:5173/api/documents
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-launcher-logs
          path: ${{ runner.temp }}/SES*/**/.ses-run/*.log

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build verified runtime-only archives
        run: python3 scripts/package-release.py
      - name: Publish preview release with two assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/SES-0.1.0-preview-windows.zip release/SES-0.1.0-preview-macos.zip --verify-tag --prerelease --title 'SES 0.1.0 (Preview)' --notes-file .github/preview-release-notes.md
